<!DOCTYPE html>

  h1 { font: inherit; font-weight: bold; margin: 0 0 12px; }

<body>
<h1>一組鍵盤滑鼠，控制桌上的每一台電腦。</h1>
<p>InputWeave 會安裝到「應用程式」，並附帶背景服務：登入時自動啟動，負責鍵鼠共享。</p>
<p>安裝完成後，InputWeave 會自動打開，帶你完成設定，過程中會請你打開需要的權限。之後要更新，打開新版本的安裝檔即可，配對資料與設定都會保留。</p>
<p>如果要從這台 Mac 移除 InputWeave，請在「安裝類型」步驟勾選「移除 InputWeave」。</p>
</body>
