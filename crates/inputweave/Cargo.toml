[package]
name = "inputweave"
description = "InputWeave background service and command-line client"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
blake3.workspace = true
clap.workspace = true
getrandom.workspace = true
iw-core.workspace = true
iw-ipc.workspace = true
iw-keymap.workspace = true
iw-net.workspace = true
iw-platform.workspace = true
iw-proto.workspace = true
serde.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[features]
# Knobs for tests only (`agent::Options::lose_relative_motion`); release
# builds have none of them.
test-hooks = []

[target.'cfg(windows)'.dependencies]
iw-winsvc.workspace = true

[dev-dependencies]
# Itself, with the test knobs, for its tests.
inputweave = { path = ".", features = ["test-hooks"] }
quinn.workspace = true
tempfile.workspace = true
