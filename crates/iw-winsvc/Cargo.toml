[package]
name = "iw-winsvc"
description = "Windows service supervisor for InputWeave: session tracking, agent/broker launch, SendSAS"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
homepage.workspace = true

[target.'cfg(windows)'.dependencies]
blake3.workspace = true
iw-ipc.workspace = true
iw-proto.workspace = true
thiserror.workspace = true
# `macros` for the broker's `tokio::select!`.
tokio = { workspace = true, features = ["macros", "rt", "sync", "time"] }
tracing.workspace = true
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authentication_Identity",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Environment",
    "Win32_System_JobObjects",
    "Win32_System_Registry",
    "Win32_System_RemoteDesktop",
    "Win32_System_Services",
    "Win32_System_Threading",
    "Win32_UI_Shell",
] }

[target.'cfg(windows)'.dev-dependencies]
windows = { workspace = true, features = ["Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
blake3.workspace = true
iw-ipc.workspace = true
iw-proto.workspace = true
tempfile.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "sync", "time"] }
tracing.workspace = true
