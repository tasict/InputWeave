[workspace]
resolver = "3"
members = ["crates/*", "xtask"]

[workspace.package]
version = "1.0.1"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false
repository = "https://github.com/tasict/InputWeave"
homepage = "https://inputweave.ctsite.cc/"

[workspace.dependencies]
iw-core = { path = "crates/iw-core" }
iw-ipc = { path = "crates/iw-ipc" }
iw-keymap = { path = "crates/iw-keymap" }
iw-net = { path = "crates/iw-net" }
iw-platform = { path = "crates/iw-platform" }
iw-proto = { path = "crates/iw-proto" }
iw-winsvc = { path = "crates/iw-winsvc" }

blake3 = "1.8"
bytes = "1.12"
clap = { version = "4.6", features = ["derive"] }
getrandom = "0.4"
hmac = "0.13"
libc = "0.2"
mdns-sd = "0.21"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false }
objc2-application-services = { version = "0.3", default-features = false }
objc2-foundation = { version = "0.3", default-features = false }
objc2-core-foundation = { version = "0.3", default-features = false }
objc2-core-graphics = { version = "0.3", default-features = false }
prost = "0.14"
prost-build = "0.14"
prost-types = "0.14"
protox = "0.10"
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
serde = { version = "1", features = ["derive"] }
sha2 = "0.11"
spake2 = "0.4"
tempfile = "3"
thiserror = "2"
tokio = { version = "1.54", default-features = false }
toml = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
windows = "0.62"
# Linux: pure Rust, so nothing needs the
# system's development packages. zbus matches the version and runtime
# ashpd brings; proxies on the client side, served objects in the tests'
# fake portals.
x11rb = { version = "0.14", default-features = false }
zbus = { version = "6", default-features = false, features = ["tokio", "proxy", "service"] }
# remote_desktop builds only with screencast, whose streams it names.
ashpd = { version = "0.14", default-features = false, features = ["tokio", "remote_desktop", "screencast", "clipboard", "input_capture"] }
futures-util = { version = "0.3", default-features = false }
reis = { version = "0.7", features = ["tokio"] }
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging", "unstable"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
# Linux desktop pictures: JPEG, PNG and
# WebP only, decoded and made into previews in pure Rust.
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
# zwp_virtual_keyboard_v1, which wlroots compositors offer for injecting keys.
wayland-protocols-misc = { version = "0.3", features = ["client"] }
# XKB keymaps and their state in Rust: the modifiers a virtual keyboard
# reports with its keys.
kbvm = { version = "0.2", default-features = false }
